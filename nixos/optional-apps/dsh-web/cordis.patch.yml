# Patch layer: route models through the self-hosted UniAPI gateway
# (https://ai-api.zhyi.xin, OpenAI-compatible /v1). The model list mirrors
# UniAPI /v1/models (all channels: opencode-go, opencode-zen, ollama-cloud,
# zhipu-coding). Each id carries a provider suffix so you can pick a
# supplier explicitly; there are no unsuffixed (auto-routed) ids.
# The API key lives in $DSH_HOME/.credentials.yaml under UNIAPI_API_KEY.
- id: llm-pi-ai
  config:
    providers:
      uniapi:
        displayName: UniAPI (ai-api.zhyi.xin)
        api: openai-completions
        baseURL: https://ai-api.zhyi.xin/v1
        apiKeyEnv: UNIAPI_API_KEY
