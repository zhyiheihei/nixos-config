# FlClash override: keep home / LTNET domains out of fake-ip and proxy.
# Merge this into FlClash's global override or the active profile's dns/rules.
dns:
  respect-rules: true
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.zhyi.cc"
    - "*.zhyi.xin"
    - "*.zhyi.dn42"
    - "localhost.ptlogin2.qq.com"
  nameserver-policy:
    "*.zhyi.cc":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "*.zhyi.xin":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"

rules:
  - "DOMAIN-SUFFIX,zhyi.cc,DIRECT"
  - "DOMAIN-SUFFIX,zhyi.xin,DIRECT"
  - "DOMAIN-SUFFIX,zhyi.dn42,DIRECT"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,198.18.0.0/15,DIRECT,no-resolve"
  - "IP-CIDR,198.19.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR6,fdd8:1938:4e88::/48,DIRECT,no-resolve"
  - "IP-CIDR6,fc00::/7,DIRECT,no-resolve"
  - "GEOIP,CN,DIRECT,no-resolve"
  - "MATCH,PROXY"
