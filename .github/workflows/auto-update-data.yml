name: 'Auto update data files'
on:
  workflow_dispatch:
  schedule:
    - cron: '32 23 * * *'
permissions:
  actions: write
  contents: write
jobs:
  auto-update:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - name: Install nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-experimental-features = nix-command flakes
            build-dir = /nix/tmpdir
            log-lines = 25

      - name: Build nix packages
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GH_PRIVATE_REPO_TOKEN }}"
          EOF

          nix run .#update-data

          rm -f secrets.toml

      - name: Commit updated packages back to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: update packages'
          commit_user_name: 'xddxdd-bot'
          commit_user_email: 'xddxdd-bot@users.noreply.github.com'

      # zhyi-packages（EPD-Dashboard/vaults3 等运行时包的源头）是公开仓，
      # 其自身每日自动跟进，但主仓 flake.lock 需要显式 update 才吃得到。
      # 在 push 到 auto-update 分支之前先定向更新并带上构建门槛，
      # 直接进 master；门槛只跑 x86_64 原生轻量包，aarch64 包
      # （epd-food-server/ws-scrcpy）在 CI 无原生构建能力，风险由
      # 下次部署时的构建暴露。
      - name: Update zhyi-packages in master
        run: |
          nix flake update zhyi-packages

          if git diff --quiet flake.lock; then
            echo 'zhyi-packages 未更新，跳过'
            exit 0
          fi

          rev=$(python3 -c "import json; print(json.load(open('flake.lock'))['nodes']['zhyi-packages']['locked']['rev'])")
          nix build -L "github:zhyiheihei/zhyi-packages/$rev#vaults3" "github:zhyiheihei/zhyi-packages/$rev#hubproxy" "github:zhyiheihei/zhyi-packages/$rev#navdash"

          git config user.name 'xddxdd-bot'
          git config user.email 'xddxdd-bot@users.noreply.github.com'
          git add flake.lock
          git commit -m 'auto: update zhyi-packages' --no-verify
          git push

      - name: Update flake inputs
        run: |
          cat > secrets.toml <<EOF
          [keys]
          github = "${{ secrets.GH_PRIVATE_REPO_TOKEN }}"
          EOF

          nix flake update

          rm -f secrets.toml

      - name: Push flake update to auto-update branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'auto: update flake inputs'
          commit_user_name: 'xddxdd-bot'
          commit_user_email: 'xddxdd-bot@users.noreply.github.com'
          branch: auto-update
          create_branch: true
          push_options: '--force'
